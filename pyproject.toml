[tool.poetry]
name = "airdrop-helper"
version = "0.1.0"
description = ""
authors = ["David Vilela <david.vilelafreire@valory.xyz>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
authlib = ">=1.6.12"
dag-cbor = "0.2.2"
jsonpatch = "1.32"
multiformats = "0.1.4.post3"
requests = ">=2.33.0"
jwcrypto = ">=1.5.7"
pycryptodome = ">=3.19.1"
jsonschema = "4.19.0"
python-dotenv = ">=1.2.2"
web3 = ">=7.15.0"
tomte = "^0.2.16"
click = "^8.1.7"
tox = "^4.13.0"
# Security floors for transitive dependencies flagged by Dependabot (no direct
# import; pinned here only to pull patched versions into the lockfile).
aiohttp = ">=3.14.0"
cryptography = ">=46.0.6"
idna = ">=3.15"
protobuf = ">=5.29.6"
urllib3 = ">=2.7.0"
filelock = ">=3.20.3"
virtualenv = ">=20.36.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
